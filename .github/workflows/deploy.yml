name: CD (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2000
          # Não usa porta padronizada, assume 22 a não ser que exista overrides.
          script: |
            set -e
            echo "Iniciando Deploy do Aponta via GitHub Actions..."
            cd /home/hermes/repos/aponta
            
            # Baixa a última versão da main
            git fetch origin main
            git reset --hard origin/main
            
            # Carrega credenciais locais do host (sudo) e sobe os containers
            source ~/.hermes/.env 2>/dev/null

            # Remove containers órfãos (de deploys anteriores interrompidos) antes
            # de recriar — evita "Conflict. The container name ... is already in
            # use" quando o nome gerado pelo compose colide com um container
            # parado que ficou pra trás. Não mexe no postgres (dado persistente).
            echo "$SUDO_PASSWORD" | sudo -S -p '' docker rm -f aponta-prod-api-1 aponta-prod-web-1 aponta-prod-migrate-1 aponta-prod-storybook-1 2>/dev/null || true

            echo "$SUDO_PASSWORD" | sudo -S -p '' -S docker compose -p aponta-prod --env-file .env.prod -f docker-compose.yml up -d --build
            
            echo "Deploy concluído com sucesso!"
