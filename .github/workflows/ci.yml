name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.8.1'

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec nx run-many -t lint --projects=api,web,web-e2e

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck --projects=api,web,web-e2e

      - name: Unit tests
        run: pnpm exec nx run-many -t test --projects=api,web

      - name: Build
        run: pnpm exec nx run-many -t build --projects=api,web

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aponta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mirrors .env.example's variable names exactly. DATABASE_URL points
      # at the `postgres` service container above (mapped to localhost on
      # the runner, matching how the api/web dev servers started by
      # apps/web-e2e/playwright.config.ts's `webServer` config connect —
      # they inherit this job's ambient env, no per-process override).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aponta?schema=public
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      NODE_ENV: development
      # Dedicated E2E ports (see apps/web-e2e/playwright.config.ts) so
      # nothing here needs to guess the default dev ports; explicit for
      # clarity even though these already match the config's own defaults.
      E2E_API_PORT: '3101'
      E2E_WEB_PORT: '3100'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply Prisma migrations
        run: pnpm exec nx run api:prisma-migrate-deploy

      - name: Seed database
        run: pnpm exec nx run api:prisma-seed

      - name: Run E2E suite
        run: pnpm exec nx run web-e2e:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/test-output/playwright/report
          retention-days: 7
