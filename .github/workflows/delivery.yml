name: Aponta delivery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Delivery contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test the verifier
        run: python3 -m unittest discover -s scripts -p test_aponta_delivery.py -v
      - name: Test the Independent QA publisher
        run: python3 -m unittest discover -s scripts -p test_publicar_qa.py -v
      - name: Verify reusable engineering skill bundles
        run: |
          python3 -m unittest discover -s scripts -p test_engineering_skills.py -v
          python3 scripts/check_engineering_skills.py
      - name: Verify identity, SPEC, TDD and design system
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aponta_delivery.py check --event "$GITHUB_EVENT_PATH"
      - name: Mirror Independent QA to the merge queue commit
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aponta_delivery.py mirror-qa-status --event "$GITHUB_EVENT_PATH"
      - name: Build affected Storybook
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" -- apps/web/src/components/ds apps/web/.storybook | read -r changed; then
            corepack enable
            corepack prepare pnpm@12.8.1 --activate
            pnpm install --frozen-lockfile
            pnpm exec nx run web:build-storybook
          fi
      - name: Preserve delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.event.pull_request.head.sha }}
          path: .delivery/
          retention-days: 30
