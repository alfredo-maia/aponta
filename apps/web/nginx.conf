server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the api service on the compose network so the web
    # app's same-origin `/api` baseURL (apps/web/src/lib/api.ts) works
    # without CORS in production, matching the dev Vite proxy's behavior
    # (apps/web/vite.config.mts `server.proxy`).
    #
    # ${API_PORT} is substituted at container start by nginx's official
    # envsubst templating (this file is copied to
    # /etc/nginx/templates/default.conf.template in the Dockerfile, which
    # nginx:1.27's entrypoint envsubst's into /etc/nginx/conf.d/default.conf
    # before nginx starts) — NOT a literal nginx variable. This must track
    # whatever API_PORT docker-compose.yml injects into the `web` service's
    # environment, or the proxy silently 502s if API_PORT is ever changed
    # from its default without updating a hardcoded port here.
    #
    # The API backend sets its own security headers via Helmet
    # (apps/api/src/main.ts) — hide them here so the browser doesn't see
    # duplicate/conflicting CSP, HSTS, X-Frame-Options, etc. on /api/ responses.
    location /api/ {
        proxy_pass http://api:${API_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    # Uploaded worklog/ticket files are stored on the API host at /uploads
    # (apps/api/src/main.ts useStaticAssets). Vite already proxies this path
    # in dev; production must too, otherwise <img src="/uploads/..."> hits
    # the SPA fallback / the static-extension regex and renders as a broken
    # image. `^~` beats `location ~* \.(png|jpg|...)$` below.
    location ^~ /uploads/ {
        proxy_pass http://api:${API_PORT}/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    # SPA fallback: client-side routing (react-router) needs unknown paths
    # to resolve to index.html rather than a 404.
    #
    # Security headers (hardening issue #38) only apply to SPA responses —
    # /api/ above hides these and relies on the API's own Helmet headers
    # instead, so they're not duplicated. CSP is intentionally permissive on
    # 'unsafe-inline' for style-src because Vite's production build still
    # emits a couple of inline <style> tags; script-src stays strict since
    # the SPA bundle is all external .js — no inline <script> anywhere.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
