server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static Storybook docs build (apps/web/storybook-static) — no /api
    # proxy needed here, this image serves only the DS component docs.
    # SPA-style fallback isn't needed either (Storybook's own manager
    # handles routing client-side off a single index.html + iframe.html),
    # but try_files keeps direct deep links to static assets working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
